---
layout: default
---

{% include base_path %}

<article class="ag-article" itemscope itemtype="http://schema.org/CreativeWork">
  {% if page.excerpt %}<meta itemprop="description" content="{{ page.excerpt | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
  {% include page-title.html %}
  <div class="ag-content" itemprop="text">
    {{ content }}
  </div>
</article>
